<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
  <title id="title">Doua Gannouni profile footer</title>
  <desc id="desc">Professional footer with engineering statement</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1200" height="170" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="170" rx="24" fill="url(#dots)"/>
  <rect x="240" y="33" width="720" height="2" rx="1" fill="url(#line)"/>

  <text x="600" y="79" text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="21" font-weight="750" fill="#ffffff">Thanks for visiting my profile</text>

  <text x="600" y="112" text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="14" font-weight="600" letter-spacing="2.2"
        fill="#bae6fd">BUILD THOUGHTFULLY · TEST CAREFULLY · IMPROVE CONTINUOUSLY</text>

  <text x="600" y="141" text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="13" fill="#cbd5e1">Open to junior and graduate opportunities worldwide</text>

  <rect x="1" y="1" width="1198" height="168" rx="23"
        fill="none" stroke="#ffffff" stroke-opacity=".11" stroke-width="2"/>
</svg>
