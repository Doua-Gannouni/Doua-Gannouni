<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Doua Gannouni - Autonomous QA pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0B1A"/>
      <stop offset="0.5" stop-color="#14102B"/>
      <stop offset="1" stop-color="#0B0B1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .name  { font-family:'Segoe UI','DejaVu Sans',sans-serif; font-weight:700; font-size:46px; fill:#F5F3FF; letter-spacing:1px; }
      .role  { font-family:'Consolas','DejaVu Sans Mono',monospace; font-weight:500; font-size:17px; fill:#A78BFA; letter-spacing:2px; }
      .node  { font-family:'Consolas','DejaVu Sans Mono',monospace; font-weight:600; font-size:11px; fill:#C4B5FD; }
      .cap    { font-family:'Consolas','DejaVu Sans Mono',monospace; font-weight:500; font-size:12px; fill:#5B6178; letter-spacing:3px; }
      .track { stroke:#2A2350; stroke-width:2; fill:none; }
      .flow  { stroke:url(#accent); stroke-width:2.4; fill:none;
               stroke-dasharray:10 240; stroke-linecap:round;
               animation:dash 4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-250; } }
      .ring  { transform-origin:center; animation:spin 9s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      .blink { animation:blink 2.4s ease-in-out infinite; }
      @keyframes blink { 0%,100%{opacity:.35} 50%{opacity:1} }
      .rise  { opacity:1; animation:rise .9s ease-out both; }
      @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
      .d2{animation-delay:.15s}.d3{animation-delay:.3s}
    </style>
  </defs>

  <rect width="900" height="240" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="238" rx="17" fill="none" stroke="#2A2350" stroke-width="1"/>

  <!-- faint grid -->
  <g stroke="#171436" stroke-width="1">
    <line x1="0" y1="60" x2="900" y2="60"/><line x1="0" y1="120" x2="900" y2="120"/><line x1="0" y1="180" x2="900" y2="180"/>
  </g>

  <!-- identity -->
  <g transform="translate(50,86)">
    <text class="name rise">Doua Gannouni</text>
    <text y="34" class="role rise d2">&lt;/&gt; Full-Stack · QA Automation · AI Workflows</text>
  </g>

  <!-- rotating orbit mark, top-right -->
  <g transform="translate(812,54)">
    <circle r="26" fill="none" stroke="#2A2350" stroke-width="1.5"/>
    <g class="ring">
      <circle r="26" fill="none" stroke="url(#accent)" stroke-width="2.5"
              stroke-dasharray="40 123" stroke-linecap="round"/>
      <circle cx="26" cy="0" r="3.5" fill="#22D3EE"/>
    </g>
    <circle r="4" fill="#8B5CF6" class="blink"/>
  </g>

  <!-- pipeline caption -->
  <text x="50" y="176" class="cap">AUTONOMOUS  QA  PIPELINE</text>

  <!-- pipeline track + animated flow -->
  <g transform="translate(50,200)">
    <path class="track" d="M12 0 H812"/>
    <path class="flow"  d="M12 0 H812"/>

    <!-- stops -->
    <g class="rise">
      <circle cx="12"  cy="0" r="6" fill="#0B0B1A" stroke="#818CF8" stroke-width="2"/>
      <text x="12"  y="22" text-anchor="middle" class="node">JIRA</text>
    </g>
    <g class="rise d2">
      <circle cx="212" cy="0" r="6" fill="#0B0B1A" stroke="#8B5CF6" stroke-width="2"/>
      <text x="212" y="22" text-anchor="middle" class="node">n8n</text>
    </g>
    <g class="rise d3">
      <circle cx="412" cy="0" r="6" fill="#0B0B1A" stroke="#A78BFA" stroke-width="2"/>
      <text x="412" y="22" text-anchor="middle" class="node">AI AGENT</text>
    </g>
    <g class="rise d2">
      <circle cx="612" cy="0" r="6" fill="#0B0B1A" stroke="#22D3EE" stroke-width="2"/>
      <text x="612" y="22" text-anchor="middle" class="node">TESTS</text>
    </g>
    <g class="rise d3">
      <circle cx="812" cy="0" r="6" fill="#0B0B1A" stroke="#34D399" stroke-width="2" filter="url(#glow)"/>
      <text x="812" y="22" text-anchor="middle" class="node" fill="#34D399">VERDICT</text>
    </g>

    <!-- travelling ticket -->
    <g>
      <rect x="-9" y="-9" width="18" height="14" rx="3" fill="#22D3EE" filter="url(#glow)">
        <animateMotion dur="4s" repeatCount="indefinite" rotate="0" keyPoints="0;1" keyTimes="0;1"
                       path="M12 0 H812" calcMode="linear"/>
      </rect>
    </g>
  </g>
</svg>
